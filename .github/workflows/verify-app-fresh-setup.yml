name: Verify fresh public App default-home setup
on:
  workflow_dispatch:
    inputs:
      verify_partial_install_retry:
        description: Actual companion transport failure, refreshed partial facts and same-process Retry (Deb only)
        type: boolean
        default: false
      platform_scope:
        type: choice
        default: all
        options: [all, linux, intel, appimage, deb, mac, windows]
      verify_missing_git_manual:
        description: Prove actual missing Git detection, exact manual restoration and App Retry (not automatic authorization)
        type: boolean
        default: false
      login_shell:
        description: Actual account shell or stock WindowsPowerShell5.1 (requires matching targeted login proof)
        type: choice
        default: default
        options: [default, windows-powershell, zsh]
      verify_login_shell:
        description: Prove required commands and foreign profile preservation in ordinary fresh login shells
        type: boolean
        default: false
      existing_user:
        description: Fresh install or explicitly seeded old/current managed-user proof
        type: choice
        default: none
        options: [none, older-idle, older-active, service-recovery, standalone-companion, current, missing-companion, corrupt-integrations, foreign-companion, corrupt-receipts, external-suite-old, external-suite-minimum, external-suite-current, external-suite-mixed-fest]
      source_revision:
        type: string
        required: true
      version:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: fresh-default-setup-${{ inputs.source_revision }}-${{ inputs.existing_user }}-login-${{ inputs.verify_login_shell || false }}-git-${{ inputs.verify_missing_git_manual || false }}-shell-${{ inputs.login_shell || 'default' }}-partial-${{ inputs.verify_partial_install_retry || false }}
  cancel-in-progress: false
jobs:
  anonymous-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate fresh-only shell proof selection
        env:
          LOGIN: ${{ inputs.verify_login_shell || false }}
          LOGIN_SHELL: ${{ inputs.login_shell || 'default' }}
          EXISTING: ${{ inputs.existing_user || 'none' }}
          GIT_RECOVERY: ${{ inputs.verify_missing_git_manual || false }}
          PARTIAL_RETRY: ${{ inputs.verify_partial_install_retry || false }}
          SCOPE: ${{ inputs.platform_scope || 'all' }}
        run: |
          if [[ "$PARTIAL_RETRY" == true && "$LOGIN:$EXISTING:$GIT_RECOVERY:$SCOPE:$LOGIN_SHELL" != false:none:false:deb:default ]]; then echo 'Partial Retry requires unseeded Deb-only mode' >&2; exit 64; fi
          if [[ "$GIT_RECOVERY" == true && "$LOGIN:$EXISTING:$SCOPE" != false:none:deb ]]; then echo "Git recovery requires unseeded Deb-only mode" >&2; exit 64; fi
          case "$LOGIN_SHELL" in
            default) ;;
            windows-powershell) [[ "$LOGIN:$EXISTING:$GIT_RECOVERY:$SCOPE" == true:none:false:windows ]] || exit 64 ;;
            zsh) [[ "$LOGIN:$EXISTING:$GIT_RECOVERY" == true:none:false && ( "$SCOPE" == mac || "$SCOPE" == intel ) ]] || exit 64 ;;
            *) echo 'Unsupported login shell proof' >&2; exit 64 ;;
          esac
          if [[ ( "$EXISTING" == corrupt-integrations || "$EXISTING" == foreign-companion ) && "$LOGIN:$GIT_RECOVERY:$SCOPE:$LOGIN_SHELL" != false:false:windows:default ]]; then echo "Manual recovery requires Windows-only current-user mode" >&2; exit 64; fi
          if [[ "$EXISTING" == corrupt-receipts && ( "$LOGIN:$GIT_RECOVERY:$LOGIN_SHELL" != false:false:default || ( "$SCOPE" != windows && "$SCOPE" != deb ) ) ]]; then echo "Receipt recovery requires Windows or Debian current-user mode" >&2; exit 64; fi
          if [[ "$EXISTING" == external-suite-* && "$LOGIN:$GIT_RECOVERY:$SCOPE:$LOGIN_SHELL" != false:false:deb:default ]]; then echo "External suite compatibility requires Debian-only normal first launch" >&2; exit 64; fi
          if [[ ( "$EXISTING" == older-active || "$EXISTING" == service-recovery || "$EXISTING" == standalone-companion ) && "$LOGIN:$GIT_RECOVERY:$SCOPE:$LOGIN_SHELL" != false:false:deb:default ]]; then echo "Selected existing-user proof requires Debian-only mode" >&2; exit 64; fi
          case "$LOGIN:$EXISTING" in false:external-suite-old|false:external-suite-minimum|false:external-suite-current|false:external-suite-mixed-fest|false:none|false:older-idle|false:older-active|false:service-recovery|false:standalone-companion|false:current|false:missing-companion|false:corrupt-integrations|false:foreign-companion|false:corrupt-receipts|true:none) ;;
            *) echo 'Login proof requires unseeded fresh setup; invalid mode' >&2; exit 64 ;; esac
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch and validate anonymous public App bytes once for the native matrix
        env:
          CANDIDATE_RUNNER_KIND: ${{ runner.environment }}
          SOURCE: ${{ inputs.source_revision }}
          VERSION: ${{ inputs.version }}
        run: python scripts/verify_app_candidate.py --mode fetch-public --source "$SOURCE" --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: anonymous-setup-inputs
          path: app-candidate/
          if-no-files-found: error
          retention-days: 7
  native:
    needs: anonymous-inputs
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.platform_scope == 'windows' && '[{"runner":"windows-2025","target":"x86_64-pc-windows-msvc","package":"both","format":"nsis"}]' || inputs.platform_scope == 'mac' && '[{"runner":"macos-15","target":"aarch64-apple-darwin","package":"both","format":"dmg"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","package":"both","format":"dmg"}]' || inputs.platform_scope == 'deb' && '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"both","format":"deb"}]' || inputs.platform_scope == 'appimage' && '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"appimage","format":"appimage"}]' || inputs.platform_scope == 'intel' && '[{"runner":"macos-15-intel","target":"x86_64-apple-darwin","package":"both","format":"dmg"}]' || inputs.platform_scope == 'linux' && '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"both","format":"deb"},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"appimage","format":"appimage"}]' || '[{"runner":"macos-15","target":"aarch64-apple-darwin","package":"both","format":"dmg"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","package":"both","format":"dmg"},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"both","format":"deb"},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"appimage","format":"appimage"},{"runner":"windows-2025","target":"x86_64-pc-windows-msvc","package":"both","format":"nsis"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.verify_missing_git_manual && 90 || matrix.runner == 'ubuntu-24.04' && 60 || 45 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require fresh hosted account
        env:
          KIND: ${{ runner.environment }}
          SCOPE: ${{ inputs.platform_scope || 'all' }}
        run: |
          test "$KIND" = github-hosted
          case "$SCOPE" in all|linux|intel|appimage|deb|mac|windows) ;; *) echo 'Unsupported platform scope' >&2; exit 1 ;; esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install hash-pinned ordinary Windows console transport
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r tests/requirements-windows-console.txt
      - name: Install Linux verifier and normal desktop dependencies only
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign xvfb x11-utils xdotool imagemagick openbox wmctrl libegl1 libegl-mesa0 libgles2 libgl1 libgl1-mesa-dri
          sudo apt-get install -y --no-install-recommends gdb
          if [[ '${{ inputs.existing_user }}' == older-active || '${{ inputs.existing_user }}' == service-recovery ]]; then sudo apt-get install -y --no-install-recommends zstd; fi
          if [[ '${{ inputs.verify_missing_git_manual || false }}' == true || '${{ inputs.existing_user }}' == corrupt-receipts || '${{ inputs.verify_partial_install_retry || false }}' == true ]]; then
            sudo apt-get install -y python3-gi gir1.2-atspi-2.0 at-spi2-core dbus-x11 gsettings-desktop-schemas libglib2.0-bin dconf-gsettings-backend dpkg-repack fakeroot
          fi
          dpkg-query -W libegl1 libegl-mesa0 libgles2 libgl1 libgl1-mesa-dri gdb libc6
      - name: Install macOS signature verifier
        if: runner.os == 'macOS'
        run: command -v minisign >/dev/null || brew install minisign
      - name: Stage pinned signature verification tool only
        if: runner.os == 'Windows'
        run: |
          archive="$RUNNER_TEMP/minisign.zip"
          curl -fsSL -o "$archive" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip
          echo "37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/app-minisign"
          cygpath -w "$RUNNER_TEMP/app-minisign/minisign-win64/x86_64" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: anonymous-setup-inputs
          path: app-candidate
      - name: Let App provision selected tools and verify normal-home relaunch
        env:
          CANDIDATE_NATIVE_DISPOSABLE: '1'
          CANDIDATE_RUNNER_KIND: ${{ runner.environment }}
          SOURCE: ${{ inputs.source_revision }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
          EXISTING_USER: ${{ inputs.existing_user || 'none' }}
          VERIFY_LOGIN_SHELL: ${{ inputs.verify_login_shell || false }}
          LOGIN_SHELL: ${{ inputs.login_shell || 'default' }}
          VERIFY_MISSING_GIT_MANUAL: ${{ inputs.verify_missing_git_manual || false }}
          VERIFY_PARTIAL_RETRY: ${{ inputs.verify_partial_install_retry || false }}
        run: |
          flags=(--login-shell "$LOGIN_SHELL")
          if [[ "$VERIFY_LOGIN_SHELL" == true ]]; then flags+=(--verify-login-shell); fi
          if [[ "$VERIFY_MISSING_GIT_MANUAL" == true ]]; then flags+=(--verify-missing-git-manual); fi
          if [[ "$VERIFY_PARTIAL_RETRY" == true ]]; then flags+=(--verify-partial-install-retry); fi
          prefix=()
          if [[ "$VERIFY_PARTIAL_RETRY" == true || "$VERIFY_MISSING_GIT_MANUAL" == true || ( "$EXISTING_USER" == corrupt-receipts && "$TARGET" == x86_64-unknown-linux-gnu ) ]]; then prefix=(dbus-run-session --); fi
          "${prefix[@]}" python scripts/verify_app_candidate.py --mode verify-fresh --source "$SOURCE" --version "$VERSION" --target "$TARGET" --linux-package "$PACKAGE" --existing-user "$EXISTING_USER" "${flags[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.verify_partial_install_retry && 'partial-selected-install' || inputs.existing_user != '' && inputs.existing_user != 'none' && format('existing-{0}', inputs.existing_user) || 'fresh-default-home' }}-${{ matrix.target }}-${{ matrix.format }}-proof
          path: app-proof/
          if-no-files-found: warn
          retention-days: 14
