name: Verify fresh public App default-home setup
on:
  workflow_dispatch:
    inputs:
      platform_scope:
        type: choice
        default: all
        options: [all, linux]
      source_revision:
        type: string
        required: true
      version:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: fresh-default-setup-${{ inputs.source_revision }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.platform_scope == 'linux' && '[{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"both","format":"deb"},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"appimage","format":"appimage"}]' || '[{"runner":"macos-15","target":"aarch64-apple-darwin","package":"both","format":"dmg"},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","package":"both","format":"dmg"},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"both","format":"deb"},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"appimage","format":"appimage"},{"runner":"windows-2025","target":"x86_64-pc-windows-msvc","package":"both","format":"nsis"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.runner == 'ubuntu-24.04' && 60 || 45 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require fresh hosted account
        env:
          KIND: ${{ runner.environment }}
          SCOPE: ${{ inputs.platform_scope || 'all' }}
        run: |
          test "$KIND" = github-hosted
          case "$SCOPE" in all|linux) ;; *) echo 'Unsupported platform scope' >&2; exit 1 ;; esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Linux verifier and normal desktop dependencies only
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign xvfb x11-utils xdotool imagemagick openbox wmctrl libegl1 libegl-mesa0 libgles2 libgl1 libgl1-mesa-dri
          dpkg-query -W libegl1 libegl-mesa0 libgles2 libgl1 libgl1-mesa-dri
      - name: Install macOS signature verifier
        if: runner.os == 'macOS'
        run: command -v minisign >/dev/null || brew install minisign
      - name: Stage pinned signature verification tool only
        if: runner.os == 'Windows'
        run: |
          archive="$RUNNER_TEMP/minisign.zip"
          curl -fsSL -o "$archive" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip
          echo "37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/app-minisign"
          cygpath -w "$RUNNER_TEMP/app-minisign/minisign-win64/x86_64" >> "$GITHUB_PATH"
      - name: Validate anonymous original public App bytes
        env:
          CANDIDATE_RUNNER_KIND: ${{ runner.environment }}
          SOURCE: ${{ inputs.source_revision }}
          VERSION: ${{ inputs.version }}
        run: python scripts/verify_app_candidate.py --mode fetch-public --source "$SOURCE" --version "$VERSION"
      - name: Let App provision selected tools and verify normal-home relaunch
        env:
          CANDIDATE_NATIVE_DISPOSABLE: '1'
          CANDIDATE_RUNNER_KIND: ${{ runner.environment }}
          SOURCE: ${{ inputs.source_revision }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
        run: python scripts/verify_app_candidate.py --mode verify-fresh --source "$SOURCE" --version "$VERSION" --target "$TARGET" --linux-package "$PACKAGE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-default-home-${{ matrix.target }}-${{ matrix.format }}-proof
          path: app-proof/
          if-no-files-found: warn
          retention-days: 14
