name: Verify distribution automation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-capture:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install hash-pinned ordinary Windows console transport
        if: runner.os == 'Windows'
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r tests/requirements-windows-console.txt
      - name: Verify owned window capture behind another window
        shell: pwsh
        env:
          CANDIDATE_NATIVE_DISPOSABLE: '1'
          CANDIDATE_RUNNER_KIND: ${{ runner.environment }}
        run: |
          ./scripts/windows_packaging_service.ps1 -SelfTest
          ./tests/integration_windows_capture.ps1
          python tests/integration_windows_console.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-capture-integration
          path: |
            ${{ runner.temp }}/owned-window-capture*
            ${{ runner.temp }}/capture-fixture-*
            ${{ runner.temp }}/ordinary-console-proof/
          if-no-files-found: ignore
  mac-window-tools:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify compiled owned Mac window and normal-quit helpers
        env:
          CANDIDATE_NATIVE_DISPOSABLE: '1'
          CANDIDATE_RUNNER_KIND: ${{ runner.environment }}
        run: python tests/integration_mac_window_tools.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-window-tools-${{ matrix.runner }}
          path: ${{ runner.temp }}/mac-window-tools-proof/
          if-no-files-found: warn
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test archive/identity failure paths in filesystem isolation
        run: |
          docker build -t obey-release-shell-contracts:local - < tests/Dockerfile.shells
          docker run --rm --user 10001:10001 \
            --tmpfs /tmp:rw,exec,size=128m,mode=1777 \
            -e CANDIDATE_TEST_CONTAINER=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/src:ro" -w /src obey-release-shell-contracts:local \
            python -m unittest discover -s tests -v
      - name: Test real offline Debian dependency installation and partial cleanup
        run: |
          docker run --rm --network none \
            -e CANDIDATE_TEST_CONTAINER=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/src:ro" -w /src python:3.13-slim \
            python -W error::ResourceWarning tests/integration_deb_install.py
      - name: Test failure-only debugger detach and timeout in isolated processes
        run: |
          docker build -t obey-release-debugger:local - < tests/Dockerfile.debugger
          docker run --rm --network none --cap-add SYS_PTRACE \
            -e CANDIDATE_TEST_CONTAINER=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/src:ro" -w /src obey-release-debugger:local \
            python -W error::ResourceWarning tests/integration_linux_startup_stack.py
          # This disposable container alone needs mount permissions to reproduce
          # AppImage's user-owned FUSE boundary; no host policy is changed.
          docker run --rm --network none --cap-add SYS_PTRACE --cap-add SYS_ADMIN \
            --device /dev/fuse --security-opt apparmor=unconfined \
            -e CANDIDATE_TEST_CONTAINER=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/src:ro" -w /src obey-release-debugger:local \
            python -W error::ResourceWarning tests/integration_linux_fuse_stack.py
