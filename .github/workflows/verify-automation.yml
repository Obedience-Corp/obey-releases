name: Verify distribution automation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-capture:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify owned window capture behind another window
        shell: pwsh
        env:
          CANDIDATE_NATIVE_DISPOSABLE: '1'
          CANDIDATE_RUNNER_KIND: ${{ runner.environment }}
        run: ./tests/integration_windows_capture.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-capture-integration
          path: |
            ${{ runner.temp }}/owned-window-capture*
            ${{ runner.temp }}/capture-fixture-*
          if-no-files-found: ignore
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test archive/identity failure paths in filesystem isolation
        run: |
          docker run --rm --user 10001:10001 \
            --tmpfs /tmp:rw,exec,size=128m,mode=1777 \
            -e CANDIDATE_TEST_CONTAINER=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/src:ro" -w /src python:3.13-slim \
            python -m unittest discover -s tests -v
      - name: Test real offline Debian dependency installation and partial cleanup
        run: |
          docker run --rm --network none \
            -e CANDIDATE_TEST_CONTAINER=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/src:ro" -w /src python:3.13-slim \
            python -W error::ResourceWarning tests/integration_deb_install.py
