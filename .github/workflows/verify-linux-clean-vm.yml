name: Qualify clean Linux VM infrastructure
on:
  pull_request:
    paths:
      - '.github/workflows/verify-linux-clean-vm.yml'
      - 'scripts/linux_kvm.py'
      - 'scripts/linux_guest.py'
      - 'scripts/linux_guest_session.py'
      - 'scripts/linux_guest_app.py'
      - 'scripts/linux_guest_journey.py'
      - 'scripts/verify_app_candidate.py'
      - 'scripts/verify_candidate.py'
  workflow_dispatch:
    inputs:
      app_source:
        description: 'Optional immutable public App source; empty qualifies desktop only'
        type: string
      app_version:
        description: 'Public App version; required with app_source'
        type: string
      app_package:
        description: 'Package to launch in the clean guest'
        type: choice
        options: [deb, appimage]
        default: deb
permissions:
  contents: read
jobs:
  native-kvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Qualify actual KVM with normal UID and existing device group
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          test "$RUNNER_KIND" = github-hosted
          test "$(id -u)" != 0
          # Limit group access to this child. No chmod, group membership change,
          # root VM process, host shares or CPU emulation fallback.
          # Hosted sudo permits root targets, not arbitrary run-as groups.
          # setpriv drops root before Python starts and prohibits regaining it.
          sudo -n /usr/bin/setpriv --reuid="$(id -u)" \
            --regid="$(getent group kvm | cut -d: -f3)" --clear-groups --no-new-privs \
            /usr/bin/env -i \
            PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 \
            CANDIDATE_NATIVE_DISPOSABLE=1 CANDIDATE_RUNNER_KIND="$RUNNER_KIND" \
            /usr/bin/python3 scripts/linux_kvm.py | tee "$RUNNER_TEMP/linux-kvm-proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-kvm-preflight
          path: ${{ runner.temp }}/linux-kvm-proof.json
          if-no-files-found: error
  clean-desktop-baseline:
    needs: native-kvm
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install VM host tools on the disposable runner
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: |
          test "$RUNNER_KIND" = github-hosted
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils \
            ovmf cloud-image-utils python3-pil gnupg curl openssh-client openssl
      - name: Boot clean desktop and optional public App journey through actual reboot
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
          APP_SOURCE: ${{ inputs.app_source }}
          APP_VERSION: ${{ inputs.app_version }}
          APP_PACKAGE: ${{ inputs.app_package }}
        run: |
          flags=()
          if [[ -n "$APP_SOURCE" || -n "$APP_VERSION" ]]; then
            [[ "$APP_SOURCE" =~ ^[a-f0-9]{40}$ && "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "${APP_PACKAGE:-deb}" == deb || "$APP_PACKAGE" == appimage ]]
            flags=(--app-source "$APP_SOURCE" --app-version "$APP_VERSION" --app-package "${APP_PACKAGE:-deb}")
          elif [[ "${APP_PACKAGE:-deb}" != deb ]]; then
            echo 'AppImage selection requires a public App source/version' >&2
            exit 64
          fi
          sudo -n /usr/bin/setpriv --reuid="$(id -u)" \
            --regid="$(getent group kvm | cut -d: -f3)" --clear-groups --no-new-privs \
            /usr/bin/env -i PATH=/usr/bin:/bin PYTHONDONTWRITEBYTECODE=1 \
            RUNNER_TEMP="$RUNNER_TEMP" CANDIDATE_NATIVE_DISPOSABLE=1 \
            CANDIDATE_RUNNER_KIND="$RUNNER_KIND" \
            /usr/bin/python3 scripts/linux_guest.py --output "$RUNNER_TEMP/linux-clean-guest-proof" "${flags[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-clean-guest-baseline
          path: ${{ runner.temp }}/linux-clean-guest-proof/
          if-no-files-found: error
