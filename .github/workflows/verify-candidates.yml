name: Verify unpublished Obey binary candidates

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Authenticated draft candidate-obey-vVERSION-SOURCE8 tag
        required: true
        type: string
      version:
        description: Candidate version without v
        required: true
        type: string
      source_revision:
        description: Full reviewed private source revision (never source content)
        required: true
        type: string

# Default and native jobs are read-only. GitHub requires push access to see
# drafts, so only the data-only fetch job has contents:write; it never runs
# candidates or contains a publication step.
permissions:
  contents: read

concurrency:
  group: candidate-proof-${{ inputs.candidate_tag }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fetch and validate draft data only
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUNNER_KIND: ${{ runner.environment }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          python scripts/verify_candidate.py --mode fetch --tag "$CANDIDATE_TAG" \
            --version "$CANDIDATE_VERSION" --source "$SOURCE_REVISION"
      - uses: actions/upload-artifact@v4
        with:
          name: validated-candidates
          path: candidate/
          if-no-files-found: error
          retention-days: 7

  native:
    needs: fetch
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: macOS-arm64
          - runner: macos-15-intel
            target: macOS-x86_64
          - runner: windows-2025
            target: windows-x86_64
          - runner: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Require a disposable native machine
        shell: bash
        env:
          RUNNER_KIND: ${{ runner.environment }}
        run: test "$RUNNER_KIND" = github-hosted
      # Only this public distribution automation is checked out. Never clone
      # private Obey implementation, modules or private test scripts here.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: validated-candidates
          path: candidate
      - name: Verify artifact bytes and native contracts
        shell: bash
        env:
          CANDIDATE_NATIVE_DISPOSABLE: '1'
          CANDIDATE_RUNNER_KIND: ${{ runner.environment }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CANDIDATE_VERSION: ${{ inputs.version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CANDIDATE_TARGET: ${{ matrix.target }}
        run: |
          python scripts/verify_candidate.py --mode verify --tag "$CANDIDATE_TAG" \
            --version "$CANDIDATE_VERSION" --source "$SOURCE_REVISION" \
            --target "$CANDIDATE_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: native-proof-${{ matrix.target }}
          path: proof-*.json
          if-no-files-found: error
